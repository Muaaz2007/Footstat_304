# Same theme as ../.streamlit/config.toml, so the dashboard looks identical
# whether Streamlit is started from the repository root or from this folder.
[theme]
base = "dark"
primaryColor = "#5EEAD4"
backgroundColor = "#080D17"
secondaryBackgroundColor = "#111A2C"
textColor = "#E9EEF8"
font = "Inter, 'Segoe UI', system-ui, sans-serif"
headingFont = "Inter, 'Segoe UI', system-ui, sans-serif"
baseFontSize = 15
baseRadius = "10px"
borderColor = "#1E2A40"
showWidgetBorder = true
dataframeBorderColor = "#1E2A40"
dataframeHeaderBackgroundColor = "#111A2C"

# Inter ships with the project (frontend/static/fonts, SIL Open Font Licence),
# so the dashboard looks the same offline and on every machine.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[theme.sidebar]
backgroundColor = "#0A101C"
secondaryBackgroundColor = "#111A2C"
borderColor = "#1E2A40"

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
